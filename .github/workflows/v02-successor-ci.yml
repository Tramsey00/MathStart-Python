name: R03 V02 published successor gate and task matrix

on:
  push:
    branches: [ms7-mig-r03-verification]
    paths:
      - '.github/workflows/v02-successor-ci.yml'
      - 'specs/migration/r03-v1/v02-successor-reviewed-8256cbf.json'
      - 'scripts/v02_successor_gate.py'
      - 'scripts/v02_task_ci.py'
      - 'scripts/v02_task_worker.py'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  successor-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Exact R03 scope/control revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 1
          persist-credentials: false
      - name: Unchanged original v3 control revision
        uses: actions/checkout@v7
        with:
          ref: 1b75c6e58ecdcb4bb172d4df979e9b9efa7dde68
          path: controls
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check executable and independent scope digest before execution
        working-directory: orchestrator
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git diff --exit-code
          git diff --cached --exit-code
          echo '508183f8efcf94b50cfd2bc2c69cd0a957423afec1948f391f7fd91e951edf85  scripts/v02_successor_gate.py' | sha256sum --check --strict
          echo '04a471757f0baf918c27f06dadb93d82a1892d1766d3842063ab3cc63fced430  specs/migration/r03-v1/v02-successor-reviewed-8256cbf.json' | sha256sum --check --strict
          echo '8235b72cc34b60b4eae1da2ced1b7d705000fbecd4fa6f93f36be16825215f49  ../controls/scripts/v02_publication_gate.py' | sha256sum --check --strict
          echo 'ce17cd0814b37d0c208279719bb945324e097aa50ad80e27715796e63f2cadd8  ../controls/scripts/v02_publication_intake.py' | sha256sum --check --strict
      - name: Scope and original publication guard regressions
        working-directory: orchestrator
        run: |
          python -I -B -m unittest discover -s tests -p test_v02_successor_gate.py -v
          python -I -B -m unittest discover -s tests -p test_published_v02_ci.py -v
      - name: Fresh Linux original v3 replay plus exact successor chain/delta and live HEAD
        working-directory: orchestrator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B scripts/v02_successor_gate.py --scope specs/migration/r03-v1/v02-successor-reviewed-8256cbf.json --scope-sha256 04a471757f0baf918c27f06dadb93d82a1892d1766d3842063ab3cc63fced430 --owner-revision "$GITHUB_SHA" --controls ../controls --output ../evidence/v02-successor
      - name: Preserve raw gate evidence on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r03-v02-successor-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/v02-successor/**
            !evidence/v02-successor/candidate/**
            !evidence/v02-successor/predecessor/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  successor-task:
    needs: successor-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      v02pg:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: postgres
        ports: ['15441:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=2s --health-timeout=3s --health-retries=30
      v01pg:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-local-only
          POSTGRES_DB: postgres
        ports: ['55441:5432']
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=2s --health-timeout=3s --health-retries=30
    steps:
      - name: Exact R03 workflow checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: orchestrator
          fetch-depth: 0
          persist-credentials: false
      - name: Exact published V02 implementation checkout
        uses: actions/checkout@v7
        with:
          ref: 8256cbf4b38e97fc1169fea85f2d558950543be8
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locked V02, separate V01, Content/section17 and no-Django target runtime
        working-directory: orchestrator
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R03_V02_SERVICE_ID: ${{ job.services.v02pg.id }}
          R03_V01_SERVICE_ID: ${{ job.services.v01pg.id }}
        run: python -I -B scripts/v02_task_ci.py --candidate ../candidate --output ../evidence/v02-task --successor-scope specs/migration/r03-v1/v02-successor-reviewed-8256cbf.json --scope-sha256 04a471757f0baf918c27f06dadb93d82a1892d1766d3842063ab3cc63fced430
      - name: Stop only owned disposable services and retain diagnostics
        if: always()
        env:
          V02_SERVICE: ${{ job.services.v02pg.id }}
          V01_SERVICE: ${{ job.services.v01pg.id }}
        run: |
          mkdir -p evidence/v02-task/service-logs
          docker logs "$V02_SERVICE" > evidence/v02-task/service-logs/v02.stdout 2> evidence/v02-task/service-logs/v02.stderr
          docker logs "$V01_SERVICE" > evidence/v02-task/service-logs/v01.stdout 2> evidence/v02-task/service-logs/v01.stderr
          docker stop "$V02_SERVICE" "$V01_SERVICE" > evidence/v02-task/service-logs/stop.stdout
          docker inspect --format '{{.State.Running}}' "$V02_SERVICE" "$V01_SERVICE" > evidence/v02-task/service-logs/stopped.stdout
          docker rm "$V02_SERVICE" "$V01_SERVICE" > evidence/v02-task/service-logs/remove.stdout
      - name: Retain exact task evidence including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r03-v02-successor-task-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            evidence/v02-task/**
            !evidence/v02-task/venv-*/**
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
