name: R03 V01 target PostgreSQL accepted integration verification

on:
  push:
    branches: [ms7-mig-r03-verification]
    paths:
      - '.github/workflows/postgres-ci.yml'
      - 'scripts/postgres_ci.py'
      - 'scripts/v01_ci_observer.py'
      - 'tests/test_postgres_ci.py'
      - 'specs/migration/r03-v1/postgres-ci-pr51.json'
      - 'scripts/accepted_integration_ci.py'
      - 'scripts/check_migration_preservation.py'
      - 'tests/test_accepted_integration_ci.py'
      - 'specs/migration/r03-v1/accepted-integration-20261015.json'
  pull_request:
    branches: [ms7-mig-react-fastapi]
    paths:
      - '.github/workflows/postgres-ci.yml'
      - 'scripts/postgres_ci.py'
      - 'scripts/v01_ci_observer.py'
      - 'tests/test_postgres_ci.py'
      - 'specs/migration/r03-v1/postgres-ci-pr51.json'
      - 'scripts/accepted_integration_ci.py'
      - 'scripts/check_migration_preservation.py'
      - 'tests/test_accepted_integration_ci.py'
      - 'specs/migration/r03-v1/accepted-integration-20261015.json'

permissions:
  contents: read

jobs:
  v01-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: mathstart_v01_ci
          POSTGRES_PASSWORD: disposable-v01-ci-only
          POSTGRES_DB: postgres
        ports:
          - 55441:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd "pg_isready -U mathstart_v01_ci -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: R03 workflow implementation checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: r03
          fetch-depth: 0
          persist-credentials: false
      - name: Exact accepted combined integration checkout
        uses: actions/checkout@v7
        with:
          ref: a359b0bf270560d5b45d0a89e1ca1e9cfddffdb6
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch exact approved source objects for squash provenance
        run: >-
          git -C candidate fetch --no-tags origin
          150279e6ca7f1c82a6f23d8899e50992cf358f55
          393d98890649c6c7c47908424ba0d076b5b5e56e
          8256cbf4b38e97fc1169fea85f2d558950543be8
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Workflow provenance and R03 evidence regressions
        working-directory: r03
        run: |
          python scripts/ci_provenance.py --output var/postgres-ci/workflow-provenance.json
          python -m unittest discover -s tests -p test_postgres_ci.py -v
          python -m unittest discover -s tests -p test_accepted_integration_ci.py -v
          python scripts/check_migration_preservation.py
      - name: Human receipts, integration checkout, frozen evidence and owned service pins
        working-directory: r03
        env:
          GITHUB_TOKEN: ${{ github.token }}
          R03_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python scripts/postgres_ci.py intake --candidate ../candidate
      - name: Separate locked target environment and explicit 34-case PostgreSQL gate
        working-directory: r03
        run: python scripts/postgres_ci.py run --candidate ../candidate
      - name: Capture service diagnostics and stop owned disposable service
        if: always()
        working-directory: r03
        env:
          R03_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: python scripts/postgres_ci.py cleanup
      - name: Retain raw target evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r03-integration-postgres-${{ github.run_id }}-${{ github.run_attempt }}
          ref: ${{ github.sha }}
          path: r03/var/postgres-ci/
          if-no-files-found: error
          retention-days: 30
