name: Migration verification

on:
  pull_request:
    branches: [ms7-mig-react-fastapi, main]
    paths: ['deploy/**', 'backend/**', 'frontend/**', 'scripts/**', 'tests/**', 'specs/**', 'site_content/**', 'curriculum/**', 'static/**', 'config/**', 'content/**', 'users/**', 'requirements*', 'alembic.ini', '.github/workflows/**', 'manage.py']
  push:
    branches: [ms7-mig-react-fastapi, main, 'ms7-mig-*']
    paths: ['deploy/**', 'backend/**', 'frontend/**', 'scripts/**', 'tests/**', 'specs/**', 'site_content/**', 'curriculum/**', 'static/**', 'config/**', 'content/**', 'users/**', 'requirements*', 'alembic.ini', '.github/workflows/**', 'manage.py']

  workflow_dispatch:
    inputs:
      full_target:
        description: Run the complete managed target and all nine browser projects
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  target-readiness:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.handoff.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - id: handoff
        name: Record implemented commands and explicit remaining target gaps
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('specs/migration/r03-v1/runtime-commands.json').read_text())
          required = data['required_backend_checks']
          missing = [key for key in required if not data.get('commands', {}).get(key)]
          ready = data.get('status') == 'REVIEWED' and all(data.get('commands', {}).get(k) for k in required)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('ready=' + str(ready).lower() + '\n')
          print('Implemented target commands: ' + ', '.join(sorted(data.get('commands', {}))))
          print('Missing required target commands: ' + ', '.join(missing))
          print('Remaining combined integration: ' + ', '.join(data.get('pending_integration', [])))
          print('R03 target: READY to exercise unchanged assertions' if ready else 'R03 target: INCOMPLETE; full target is not verified. Available entries run in public scoped CI.')
          PY
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: ms6_v01_smoke_ci
          POSTGRES_USER: mathstart_ci
          POSTGRES_PASSWORD: disposable-ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mathstart_ci -d ms6_v01_smoke_ci"
          --health-interval=2s --health-timeout=3s --health-retries=30
    env:
      DJANGO_SECRET_KEY: ci-only-key-for-harness-verification
      DJANGO_DEBUG: 'False'
      DJANGO_DB_BACKEND: postgresql
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: '5432'
      DJANGO_DB_NAME: ms6_v01_smoke_ci
      DJANGO_DB_USER: mathstart_ci
      DJANGO_DB_PASSWORD: disposable-ci-only-password
      DJANGO_DB_TEST_NAME: test_mathstart_ci
      DJANGO_RUNTIME_ROOT: ${{ github.workspace }}/var/ci-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --no-deps -r requirements.lock
          python -m pip check
      - name: Runtime version report
        run: python scripts/version_report.py
      - name: Connection failure is bounded and nonzero
        run: |
          if DJANGO_DB_PORT=1 python scripts/check_database.py; then
            echo "Expected connection failure did not occur"
            exit 1
          fi
      - name: Fresh PostgreSQL migration/bootstrap/static/content smoke
        run: python scripts/fresh_install_smoke.py --disposable
      - name: Verify repository
        run: python scripts/verify_repo.py
      - name: R02A HTTP and eligibility contract
        run: python -m unittest discover -s tests -p test_r02a_contract.py -v
      - name: R03A CompletionFact contract
        run: python -m unittest discover -s tests -p test_r03a_contract.py -v
      - name: Unchanged standalone R02 suite on accepted input (historical baseline)
        run: |
          git worktree add --detach var/r02-baseline 8d958aeeb17da46839722441425ccbb5889e2ab7
          cd var/r02-baseline
          python -m unittest discover -s tests -p 'test_migration_r02*.py' -v

  pure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locked tooling without Django or DRF
        run: |
          python -m pip install --no-deps -r specs/migration/r03-v1/verification.lock
          python -m pip check
          python -c "import importlib.util; assert importlib.util.find_spec('django') is None; assert importlib.util.find_spec('rest_framework') is None"
          python scripts/version_report.py --profile pure
      - name: Exact checkout and event linkage
        run: python scripts/ci_provenance.py --output var/ci/provenance.json
      - name: Pure, protocol models, adapters and Harness
        run: python scripts/verify_repo.py --profile pure
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: r03-pure-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: var/ci/
          if-no-files-found: error

  backend-install:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: test_ms7_mig_v01_backend_ci
          POSTGRES_USER: mathstart_ci
          POSTGRES_PASSWORD: disposable-backend-ci-only
        ports: ['55441:5432']
        options: >-
          --health-cmd="pg_isready -U mathstart_ci -d test_ms7_mig_v01_backend_ci"
          --health-interval=2s --health-timeout=3s --health-retries=30
    env:
      MATHSTART_DATABASE_URL: postgresql+psycopg://mathstart_ci:disposable-backend-ci-only@127.0.0.1:55441/test_ms7_mig_v01_backend_ci
      MATHSTART_DB_BACKEND: postgresql
      MATHSTART_DISPOSABLE: '1'
      MATHSTART_LEGACY_PYTHON: ${{ github.workspace }}/var/backend-legacy-env/bin/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Locked independent target and legacy environments
        run: |
          python -m venv var/backend-target-env
          var/backend-target-env/bin/python -m pip install --no-deps -r backend/tests/v04/requirements.lock
          var/backend-target-env/bin/python -m pip check
          var/backend-target-env/bin/python -c "import importlib.util; assert importlib.util.find_spec('django') is None; assert importlib.util.find_spec('rest_framework') is None"
          python -m venv var/backend-legacy-env
          var/backend-legacy-env/bin/python -m pip install --no-deps -r requirements.lock
          var/backend-legacy-env/bin/python -m pip install --no-deps argon2-cffi==25.1.0 argon2-cffi-bindings==25.1.0 bcrypt==4.3.0 cffi==2.0.0 pycparser==2.23
          var/backend-legacy-env/bin/python -m pip check
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --maxsockets=1 --cache var/backend-npm-cache
      - name: Exact checkout provenance
        run: python scripts/ci_provenance.py --output var/backend-ci-provenance.json
      - name: Full backend suites with owned databases and no skipped tests
        run: var/backend-target-env/bin/python scripts/target_check.py backend-tests
      - name: Managed build, ASGI and all read-only target commands
        run: >-
          var/backend-target-env/bin/python scripts/verify_target.py
          --runtime-root var/target-managed
          --legacy-python var/backend-legacy-env/bin/python
          --group backend --group database --group content
      - name: Real fresh twice and populated upgrade A B C
        run: |
          var/backend-target-env/bin/python scripts/target_check.py fresh-install --disposable
          var/backend-target-env/bin/python scripts/target_check.py upgrade-A --disposable
          var/backend-target-env/bin/python scripts/target_check.py upgrade-B --disposable
          var/backend-target-env/bin/python scripts/target_check.py upgrade-C --disposable
      - name: Retain safe command receipts, exclude runtime credentials
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/backend-ci-provenance.json
            var/target-checks/**/result.json
            var/target-managed/result.json
          if-no-files-found: error
          retention-days: 30

  deployment-images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Exact deployment checkout
        run: python scripts/ci_provenance.py --output var/deployment-provenance.json
      - name: Build independent API and non-root edge images
        run: |
          docker build -f deploy/Dockerfile --target api -t mathstart-api:verification .
          docker build -f deploy/Dockerfile --target edge -t mathstart-edge:verification .
          docker pull postgres@sha256:efedf3595f1d6f415c08568ba171029bf54052e754cc9f030e3f2412b21f3d67
      - name: Owned Compose release schema and fail-closed startup
        run: >-
          python scripts/verify_deployment.py --disposable
          --runtime-root var/deployment-ci
          --api-image mathstart-api:verification
          --edge-image mathstart-edge:verification
      - name: Retain safe deployment receipts only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/deployment-provenance.json
            var/deployment-ci/result.json
          if-no-files-found: error
          retention-days: 30

  target:
    needs: target-readiness
    if: needs.target-readiness.outputs.ready == 'true' || (github.event_name == 'workflow_dispatch' && inputs.full_target)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: test_ms7_mig_v01_full_target
          POSTGRES_USER: mathstart_ci
          POSTGRES_PASSWORD: disposable-target-ci-only
        ports: ['55441:5432']
        options: >-
          --health-cmd="pg_isready -U mathstart_ci -d test_ms7_mig_v01_full_target"
          --health-interval=2s --health-timeout=3s --health-retries=30
    env:
      MATHSTART_DATABASE_URL: postgresql+psycopg://mathstart_ci:disposable-target-ci-only@127.0.0.1:55441/test_ms7_mig_v01_full_target
      MATHSTART_V04_DATABASE_URL: postgresql+psycopg://mathstart_ci:disposable-target-ci-only@127.0.0.1:55441/test_ms7_mig_v01_full_target
      MATHSTART_DB_BACKEND: postgresql
      MATHSTART_DISPOSABLE: '1'
      MATHSTART_LEGACY_PYTHON: ${{ github.workspace }}/var/full-legacy-env/bin/python
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/frontend/.cache/browsers
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
      - name: Separate locked target and legacy environments
        run: |
          python -m venv var/full-target-env
          var/full-target-env/bin/python -m pip install --no-deps -r backend/tests/v04/requirements.lock
          var/full-target-env/bin/python -m pip check
          var/full-target-env/bin/python -c "import importlib.util; assert importlib.util.find_spec('django') is None; assert importlib.util.find_spec('rest_framework') is None"
          python -m venv var/full-legacy-env
          var/full-legacy-env/bin/python -m pip install --no-deps -r requirements.lock
          var/full-legacy-env/bin/python -m pip install --no-deps argon2-cffi==25.1.0 argon2-cffi-bindings==25.1.0 bcrypt==4.3.0 cffi==2.0.0 pycparser==2.23
          var/full-legacy-env/bin/python -m pip check
          npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
          npm --prefix frontend ci --maxsockets=1 --cache var/full-npm-cache
      - name: Install the actual Chrome Edge and Firefox browsers
        working-directory: frontend
        run: npx --no-install playwright install --with-deps chrome msedge firefox
      - name: Exact checkout provenance
        run: python scripts/ci_provenance.py --output var/full-target-provenance.json
      - name: Complete registry and fresh twice plus populated A B C
        run: >-
          var/full-target-env/bin/python scripts/verify_target.py
          --runtime-root var/full-target
          --legacy-python var/full-legacy-env/bin/python
      - name: Retain safe combined receipts without cookies or runtime secrets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-target-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            var/full-target-provenance.json
            var/full-target/result.json
            var/target-checks/**/result.json
          if-no-files-found: error
          retention-days: 30
