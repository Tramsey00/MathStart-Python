name: R03 V02 external publication gate

on:
  push:
    branches: [ms7-mig-r03-verification]
    paths:
      - '.github/workflows/v02-publication-gate.yml'
      - 'scripts/v02_publication_*.py'
      - 'specs/migration/r03-v1/v02-publication/**'
      - 'docs/acceptance/MS7-MIG-R03/v02-source-snapshot-20261014.zip'

permissions:
  contents: read

jobs:
  original-snapshot-and-external-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OWNER_REVISION: 1b75c6e58ecdcb4bb172d4df979e9b9efa7dde68
    steps:
      - name: Exact owner-controlled R03 revision
        uses: actions/checkout@v7
        with:
          ref: 1b75c6e58ecdcb4bb172d4df979e9b9efa7dde68
          path: owner
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Record workflow and control provenance before code execution
        working-directory: owner
        run: |
          test "$(git rev-parse HEAD)" = "$OWNER_REVISION"
          git diff --exit-code
          git diff --cached --exit-code
          echo '8235b72cc34b60b4eae1da2ced1b7d705000fbecd4fa6f93f36be16825215f49  scripts/v02_publication_gate.py' | sha256sum --check --strict
          echo 'ce17cd0814b37d0c208279719bb945324e097aa50ad80e27715796e63f2cadd8  scripts/v02_publication_intake.py' | sha256sum --check --strict
          mkdir -p var/v02-publication-provenance
          python -I -B - <<'PY'
          import json, os, pathlib, platform, subprocess, sys
          result = {
              'owner_control_revision': os.environ['OWNER_REVISION'],
              'actual_owner_checkout_sha': subprocess.check_output(['git', 'rev-parse', 'HEAD']).decode().strip(),
              'workflow_event_sha': os.environ['GITHUB_SHA'],
              'workflow_revision_sha': os.environ.get('GITHUB_WORKFLOW_SHA'),
              'workflow_ref': os.environ.get('GITHUB_WORKFLOW_REF'),
              'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'python': sys.version, 'platform': platform.platform(),
              'candidate_implementation_sha': None,
              'candidate_representation': 'ORIGINAL_STAGED_TREE_NO_IMPLEMENTATION_COMMIT',
              'accepted_base': '0c03197e23f69a233c0fcf8bdffa336feca20b92',
              'approved_tree': 'dbad1e853dff354c5d3255755afb5cc32e0ad279',
          }
          assert sys.platform == 'linux'
          pathlib.Path('var/v02-publication-provenance/workflow.json').write_text(json.dumps(result, indent=2)+'\n')
          PY
      - name: Restore actual blobs, positive gate, real negative attacks and restored positive
        working-directory: owner
        run: python -I -B scripts/v02_publication_gate.py suite --owner-revision "$OWNER_REVISION" --output var/v02-publication-linux
      - name: Preserve raw results on success or failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r03-v02-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            owner/var/v02-publication-provenance/
            owner/var/v02-publication-linux/*.json
            owner/var/v02-publication-linux/gate-raw/
            owner/var/v02-publication-linux/owner-controlled/
            owner/var/v02-publication-linux/probe-*/
            owner/var/v02-publication-linux/restored/raw/
            owner/var/v02-publication-linux/restored/snapshot-verification.json
            owner/var/v02-publication-linux/restored/package/transport/whitespace/
          if-no-files-found: error
          retention-days: 90
