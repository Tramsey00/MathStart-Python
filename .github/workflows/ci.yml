name: Harness verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Locked target tooling without Django
        run: |
          python -m pip install --no-deps -r specs/migration/r03-v1/verification.lock
          python -m pip check
          python -c "import importlib.util; assert not importlib.util.find_spec('django'); assert not importlib.util.find_spec('rest_framework')"
      - name: Current default registry and complete portable Harness contracts
        run: |
          python scripts/verify_repo.py --list
          python scripts/verify_repo.py --profile pure
          python scripts/check_migration_preservation.py
          python -m unittest tests.test_i02_ui_contract -v
      # PostgreSQL/SSG/browser/installation/recovery execution is mandatory in
      # Migration verification. This job proves portable Harness behavior only.
