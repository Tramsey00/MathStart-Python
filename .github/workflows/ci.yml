name: Product verification

on:
  pull_request:
    branches: [main]
    paths: ['AGENTS.md', 'ARCHITECTURE.md', 'PRODUCT.md', 'README.md', 'docs/**', 'skills/**', 'backend/**', 'frontend/**', 'scripts/**', 'curriculum/**', 'site_content/**', 'specs/**', 'tests/**', 'requirements*', 'alembic.ini', '.github/workflows/**']
  push:
    branches: [main, ui/ux, 'ms-t*']
    paths: ['AGENTS.md', 'ARCHITECTURE.md', 'PRODUCT.md', 'README.md', 'docs/**', 'skills/**', 'backend/**', 'frontend/**', 'scripts/**', 'curriculum/**', 'site_content/**', 'specs/**', 'tests/**', 'requirements*', 'alembic.ini', '.github/workflows/**']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Minimal target tooling
        run: |
          python -m pip install --no-deps -r backend/tests/v04/requirements.lock
          python -m pip check
          python -c "import importlib.util; assert not importlib.util.find_spec('django'); assert not importlib.util.find_spec('rest_framework')"
      - uses: actions/setup-node@v6
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Locked frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Frontend unit tests and typecheck
        working-directory: frontend
        run: |
          npm run test:lesson
          npm run typecheck
      - name: Pure lesson document contract
        run: python -m unittest backend.tests.v04.test_lesson_document backend.tests.v04.test_lesson_navigation -v
      - name: Documentation and source gates
        run: |
          python scripts/check_product_source.py
          python scripts/check_workflow_docs.py
          python scripts/check_migration_preservation.py
          python -m unittest tests.test_i02_ui_contract -v
      # PostgreSQL, legacy, browser matrix, clean installation and recovery stay
      # available in the explicit migration workflows, not ordinary lesson work.
