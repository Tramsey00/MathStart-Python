<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MathStart</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: linear-gradient(135deg, #eff6ff 0%, #f7f4ff 100%);
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .card {
      width: 100%;
      max-width: 720px;
      padding: 48px;
      border: 1px solid #dbeafe;
      border-radius: 30px;
      background: #ffffff;
      box-shadow: 0 14px 34px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 18px;
      padding: 8px 15px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      color: #2563eb;
      font-size: 14px;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 48px;
      letter-spacing: -0.04em;
    }

    p {
      margin: 0;
      color: #4b5563;
      font-size: 18px;
      line-height: 1.7;
    }

    .status {
      margin-top: 28px;
      padding: 16px;
      border-radius: 18px;
      background: #ecfdf5;
      color: #166534;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="badge">Python backend</div>

    <h1>MathStart</h1>

    <p>
      Django-проект успешно создан. Приложение контента,
      шаблоны и маршрутизация работают.
    </p>

    <div class="status">
      Первый этап настройки завершён
    </div>
  </main>
</body>
</html>
