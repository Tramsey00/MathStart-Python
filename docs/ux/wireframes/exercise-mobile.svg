<svg xmlns="http://www.w3.org/2000/svg" width="390" height="940" viewBox="0 0 390 940" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity exercise mobile wireframe</title><desc id="desc">Mobile exercise vertically separates task, hint, reveal, feedback states, post-reveal message, retry, and degraded Tutor state.</desc><style>text{font-family:Arial,sans-serif;font-size:12px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:17px;font-weight:bold}.m{font-size:9px}</style><rect class="s" x="10" y="10" width="370" height="920"/><text x="28" y="42" class="h">LOW-FIDELITY · Exercise / mobile</text><rect class="s" x="25" y="63" width="340" height="36"/><text x="38" y="87">‹ Тема / Уравнения</text><text x="25" y="130" class="h">Пошаговое решение</text><text x="25" y="154">Исходное условие: 2(x+3)=10</text><rect class="s" x="25" y="172" width="340" height="43"/><text x="42" y="199">1. [ 2x+3=10                         ]</text><rect class="s" x="25" y="226" width="340" height="43"/><text x="42" y="253">2. [                                   ]</text><text x="25" y="302">[+ Шаг] [Сохранить] [Отправить]</text><rect class="s" x="25" y="325" width="340" height="72"/><text x="42" y="351">Подсказка 2 из 3</text><text x="42" y="377">[Получить] [Продолжить решение]</text><rect class="s" x="25" y="410" width="340" height="66"/><text x="42" y="436">Полное решение</text><text x="42" y="460">[Показать] → отдельное подтверждение</text><rect class="s" x="25" y="490" width="340" height="78"/><text x="42" y="516">Ошибка подтверждена: строка 1</text><text x="42" y="540">Проверьте раскрытие скобок</text><text x="42" y="559" class="m">DEV: confirmed</text><rect class="s" x="25" y="580" width="340" height="95"/><text x="42" y="605">Нужна проверка — тип ошибки не подтверждён</text><text x="42" y="630">Формат пока нельзя надёжно проверить</text><text x="42" y="655">Нет надёжного вывода проверки</text><rect class="s" x="25" y="688" width="340" height="84"/><text x="42" y="714">Решение раскрыто для этой версии.</text><text x="42" y="738">Повтор не даст нового самостоятельного</text><text x="42" y="757">подтверждения.  DEV: revealed</text><rect class="s" x="25" y="785" width="340" height="88"/><text x="42" y="811">Проверяем… Ввод сохранён.</text><text x="42" y="835">Помощник недоступен; проверка работает.</text><text x="42" y="857">[Повторить] [Подготовленная подсказка]</text><text x="25" y="910" class="m">DEV: Wrong final: no diagnosis; correction after verdict → new Attempt.</text></svg>
