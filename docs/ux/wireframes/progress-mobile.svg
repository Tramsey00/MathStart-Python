<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity progress mobile wireframe</title><desc id="desc">Mobile progress view stacks topic summary, student-readable skill states, legend and history.</desc><style>text{font-family:Arial,sans-serif;font-size:12px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:18px;font-weight:bold}.m{font-size:9px}</style><rect class="s" x="10" y="10" width="370" height="824"/><text x="28" y="42" class="h">LOW-FIDELITY · Progress / mobile</text><rect class="s" x="25" y="63" width="340" height="36"/><text x="38" y="87">‹ Каталог     Мой прогресс</text><rect class="s" x="25" y="122" width="340" height="130"/><text x="42" y="152" class="h">Уравнения</text><text x="42" y="180">Освоение: 64 из 100</text><text x="42" y="204">Подтверждённость оценки: 42 из 100</text><text x="42" y="228">Покрытие: 4 навыка из 10</text><text x="42" y="245" class="m">Нет данных → «Пока недостаточно проверок»</text><text x="25" y="285" class="h">Навыки</text><rect class="s" x="25" y="298" width="340" height="76"/><text x="42" y="326">Раскрытие скобок</text><text x="42" y="350">Продолжаем изучение · обновлено 26 сентября</text><rect class="s" x="25" y="388" width="340" height="76"/><text x="42" y="416">Линейные уравнения</text><text x="42" y="440">Нужна практика · [Почему] [Начать]</text><rect class="s" x="25" y="478" width="340" height="76"/><text x="42" y="506">Правила знаков</text><text x="42" y="530">Ещё не проверено · [Диагностика]</text><rect class="s" x="25" y="574" width="340" height="92"/><text x="42" y="604">Самооценка отмечается отдельно.</text><text x="42" y="630">«Ещё не проверено» не означает «не знает».</text><rect class="s" x="25" y="690" width="340" height="58"/><text x="42" y="724">[История попыток и помощи]</text><text x="25" y="792" class="m">DEV: server-provided state; no client calculation.</text></svg>
