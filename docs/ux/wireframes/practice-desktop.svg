<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity practice desktop wireframe</title><desc id="desc">Desktop practice session shows target, reason, item count, independent streak, exact stop conditions, hard limit and return.</desc><style>text{font-family:Arial,sans-serif;font-size:16px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:23px;font-weight:bold}.m{font-size:12px}</style><rect class="s" x="20" y="20" width="1160" height="720"/><text x="50" y="58" class="h">LOW-FIDELITY · Practice / desktop</text><rect class="s" x="45" y="82" width="1110" height="42"/><text x="65" y="109">Практика · [Вернуться к теме «Уравнения»]</text><rect class="s" x="45" y="150" width="365" height="245"/><text x="70" y="190" class="h">Цель практики</text><text x="70" y="225">Навык: правила знаков</text><text x="70" y="255">Почему выбрано: навык нужен для текущей темы</text><text x="70" y="290">Задание 2 из 7</text><text x="70" y="320">Самостоятельно верно подряд: 1 из 3</text><text x="70" y="358">[Оставить практику]</text><rect class="s" x="440" y="150" width="715" height="330"/><text x="470" y="190" class="h">Текущее задание</text><text x="470" y="235">-8 * (-4) = ?</text><rect class="s" x="470" y="260" width="635" height="55"/><text x="490" y="294">[ Введите ответ                              ]</text><text x="470" y="350">[Подсказка] [Отправить]</text><rect class="s" x="470" y="395" width="635" height="58"/><text x="490" y="425">Проверяем ответ… Введённые данные сохранены.</text><text x="490" y="447" class="m">DEV: retry uses same request identity; no new evidence.</text><rect class="s" x="45" y="515" width="1110" height="145"/><text x="70" y="548" class="h">Когда практика завершится</text><text x="70" y="578">• 3 самостоятельных верных ответа подряд на разных подходящих версиях заданий; или</text><text x="70" y="606">• освоение ≥ 70 и подтверждённость ≥ 60 после хотя бы одного проверенного задания.</text><text x="70" y="634">В любом случае — не больше 7 заданий. После завершения: [Вернуться к теме]</text><text x="50" y="705" class="m">Нет подходящего задания / повтор не подходит → понятное сообщение и безопасный следующий шаг.</text></svg>
