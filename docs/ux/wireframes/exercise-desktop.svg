<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity exercise desktop wireframe</title><desc id="desc">Desktop exercise distinguishes confirmed, uncertain, unsupported, indeterminate, hint, reveal confirmation, revealed, retry, and Tutor outage states.</desc><style>text{font-family:Arial,sans-serif;font-size:16px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:23px;font-weight:bold}.m{font-size:12px}</style><rect class="s" x="20" y="20" width="1160" height="780"/><text x="50" y="58" class="h">LOW-FIDELITY · Exercise / desktop</text><rect class="s" x="45" y="82" width="1110" height="42"/><text x="65" y="109">Каталог / 6 класс / Уравнения / Раскрытие скобок</text><rect class="s" x="45" y="150" width="510" height="570"/><text x="70" y="190" class="h">Пошаговое решение</text><text x="70" y="224">Исходное условие (только чтение)</text><rect class="s" x="70" y="238" width="455" height="45"/><text x="88" y="267">2(x+3)=10</text><text x="70" y="315">Шаги решения</text><rect class="s" x="70" y="330" width="455" height="48"/><text x="88" y="360">1  [ 2x+3=10                         ]</text><rect class="s" x="70" y="390" width="455" height="48"/><text x="88" y="420">2  [                                   ]</text><text x="70" y="470">[+ Шаг] [Сохранить черновик] [Отправить]</text><rect class="s" x="70" y="505" width="455" height="80"/><text x="88" y="535">Подсказка 2 из 3</text><text x="88" y="563">[Получить подсказку] [Продолжить решение]</text><rect class="s" x="70" y="602" width="455" height="84"/><text x="88" y="632">Полное решение — отдельное действие</text><text x="88" y="660">[Показать] → «Показать полный ответ?»</text><rect class="s" x="585" y="150" width="570" height="570"/><text x="610" y="190" class="h">Результат и состояния</text><rect class="s" x="610" y="212" width="520" height="68"/><text x="630" y="240">Ошибка подтверждена: строка 1</text><text x="630" y="266">Проверьте раскрытие скобок. [Практика] [Диагностика]</text><rect class="s" x="610" y="292" width="520" height="58"/><text x="630" y="318">Нужна проверка: тип ошибки не подтверждён.</text><text x="630" y="340" class="m">DEV annotation: uncertain</text><rect class="s" x="610" y="362" width="520" height="58"/><text x="630" y="388">Этот формат пока нельзя надёжно проверить.</text><text x="630" y="410" class="m">DEV annotation: unsupported</text><rect class="s" x="610" y="432" width="520" height="58"/><text x="630" y="458">Проверка завершилась без надёжного вывода.</text><text x="630" y="480" class="m">DEV annotation: indeterminate</text><rect class="s" x="610" y="502" width="520" height="74"/><text x="630" y="530">Решение раскрыто для этой версии задания.</text><text x="630" y="554">Повтор версии не даст нового самостоятельного подтверждения.</text><text x="630" y="572" class="m">DEV annotation: revealed · user + exercise_version</text><rect class="s" x="610" y="590" width="520" height="88"/><text x="630" y="618">Проверяем ответ… Введённые данные сохранены.</text><text x="630" y="644">Помощник временно недоступен; проверка задания работает.</text><text x="630" y="668">[Повторить запрос] [Использовать подготовленную подсказку]</text><text x="50" y="770" class="m">DEV: Wrong final UI: no named misconception. After completed evaluation, correction starts a new Attempt.</text></svg>
