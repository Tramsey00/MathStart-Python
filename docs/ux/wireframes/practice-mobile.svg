<svg xmlns="http://www.w3.org/2000/svg" width="390" height="900" viewBox="0 0 390 900" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity practice mobile wireframe</title><desc id="desc">Mobile practice vertically shows target, selection reason, item count, independent streak, stop conditions, hard limit and return.</desc><style>text{font-family:Arial,sans-serif;font-size:12px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:17px;font-weight:bold}.m{font-size:9px}</style><rect class="s" x="10" y="10" width="370" height="880"/><text x="28" y="42" class="h">LOW-FIDELITY · Practice / mobile</text><rect class="s" x="25" y="63" width="340" height="36"/><text x="38" y="87">‹ Вернуться к теме «Уравнения»</text><rect class="s" x="25" y="122" width="340" height="158"/><text x="42" y="152" class="h">Цель практики</text><text x="42" y="180">Навык: правила знаков</text><text x="42" y="204">Почему: нужен для текущей темы</text><text x="42" y="230">Задание 2 из 7</text><text x="42" y="255">Самостоятельно верно: 1 из 3 подряд</text><rect class="s" x="25" y="300" width="340" height="210"/><text x="42" y="332" class="h">-8 * (-4) = ?</text><rect class="s" x="42" y="354" width="306" height="45"/><text x="56" y="383">[ Введите ответ ]</text><text x="42" y="433">[Подсказка] [Отправить]</text><text x="42" y="468">Проверяем… Введённые данные сохранены.</text><text x="42" y="491" class="m">DEV: retry ≠ new evidence</text><rect class="s" x="25" y="530" width="340" height="190"/><text x="42" y="560" class="h">Завершение</text><text x="42" y="590">3 самостоятельных верных подряд</text><text x="42" y="612">на разных подходящих версиях; или</text><text x="42" y="642">освоение ≥ 70 и подтверждённость ≥ 60</text><text x="42" y="664">после проверенного задания.</text><text x="42" y="694">Предел: 7 заданий. [Вернуться к теме]</text><rect class="s" x="25" y="742" width="340" height="74"/><text x="42" y="770">Подходящего задания сейчас нет.</text><text x="42" y="795">[Вернуться к теме] [Пройти диагностику]</text><text x="25" y="858" class="m">DEV: stable server session/item on refresh and back.</text></svg>
