<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity onboarding desktop wireframe</title><desc id="desc">Desktop onboarding: profile context, grade selection, three distinct onboarding choices, and save states.</desc><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.muted{font-size:14px}.h{font-size:26px;font-weight:bold}</style><rect class="s" x="20" y="20" width="1160" height="720"/><text x="55" y="65" class="h">LOW-FIDELITY · Onboarding / desktop</text><rect class="s" x="50" y="95" width="1100" height="52"/><text x="70" y="128">MathStart | Каталог | Мой прогресс | Профиль ученика</text><text x="75" y="205" class="h">Выберите класс и путь начала</text><rect class="s" x="75" y="230" width="350" height="90"/><text x="95" y="266">Класс: [ 6 ▼ ]</text><text x="95" y="298" class="muted">Меняет навигацию, но не удаляет историю</text><rect class="s" x="75" y="360" width="320" height="220"/><text x="95" y="400" class="h">С начала</text><text x="95" y="438">Навыки ещё не проверены</text><text x="95" y="475">[Выбрать]</text><rect class="s" x="440" y="360" width="320" height="220"/><text x="460" y="400" class="h">Диагностика</text><text x="460" y="438">Короткая проверка создаёт</text><text x="460" y="464">проверенные свидетельства</text><text x="460" y="505">[Начать диагностику]</text><rect class="s" x="805" y="360" width="320" height="220"/><text x="825" y="400" class="h">Знакомые темы</text><text x="825" y="438">Это самооценка, не проверка</text><text x="825" y="475">[Отметить темы]</text><rect class="s" x="75" y="612" width="510" height="78"/><text x="95" y="643">Сохраняем выбор…</text><text x="95" y="671" class="muted">После сохранения откроется каталог</text><rect class="s" x="615" y="612" width="510" height="78"/><text x="635" y="643">Не удалось сохранить выбор</text><text x="635" y="671">[Повторить]</text><text x="75" y="720" class="muted">DEV: keyboard order verified; teacher/parent scope absent.</text></svg>
