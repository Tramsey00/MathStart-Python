<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity onboarding mobile wireframe</title><desc id="desc">Mobile onboarding stacks class choice, three learning paths, and understandable save states.</desc><style>text{font-family:Arial,sans-serif;font-size:14px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:19px;font-weight:bold}.muted{font-size:11px}</style><rect class="s" x="10" y="10" width="370" height="824"/><text x="30" y="43" class="h">LOW-FIDELITY · Onboarding</text><rect class="s" x="25" y="65" width="340" height="38"/><text x="38" y="89">‹ Назад   MathStart   Профиль</text><text x="28" y="142" class="h">Выберите класс и путь</text><rect class="s" x="25" y="160" width="340" height="64"/><text x="42" y="190">Класс: [ 6 ▼ ]</text><text x="42" y="211" class="muted">История сохраняется при смене класса</text><rect class="s" x="25" y="245" width="340" height="112"/><text x="42" y="275" class="h">С начала</text><text x="42" y="301">Навыки ещё не проверены</text><text x="42" y="331">[Выбрать]</text><rect class="s" x="25" y="374" width="340" height="126"/><text x="42" y="404" class="h">Диагностика</text><text x="42" y="430">Создаёт проверенные свидетельства</text><text x="42" y="472">[Начать]</text><rect class="s" x="25" y="517" width="340" height="126"/><text x="42" y="547" class="h">Знакомые темы</text><text x="42" y="573">Самооценка, не результат проверки</text><text x="42" y="615">[Отметить]</text><rect class="s" x="25" y="666" width="340" height="94"/><text x="42" y="694">Сохраняем выбор…</text><text x="42" y="720">Не удалось сохранить. [Повторить]</text><text x="42" y="744" class="muted">Введённый выбор не потерян</text><text x="25" y="803" class="muted">DEV: focus order remains predictable after save.</text></svg>
