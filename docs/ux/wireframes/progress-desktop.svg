<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Low-fidelity progress desktop wireframe</title><desc id="desc">Student-facing desktop progress view with understandable server-provided labels and history.</desc><style>text{font-family:Arial,sans-serif;font-size:17px;fill:#111}.s{fill:none;stroke:#111;stroke-width:2}.h{font-size:24px;font-weight:bold}.m{font-size:13px}</style><rect class="s" x="20" y="20" width="1160" height="720"/><text x="50" y="58" class="h">LOW-FIDELITY · Progress / desktop</text><rect class="s" x="45" y="82" width="1110" height="42"/><text x="65" y="109">Мой прогресс | История | Каталог</text><rect class="s" x="45" y="150" width="350" height="170"/><text x="70" y="190" class="h">Тема: Уравнения</text><text x="70" y="225">Освоение: 64 из 100</text><text x="70" y="255">Подтверждённость оценки: 42 из 100</text><text x="70" y="285">Покрытие: 4 навыка из 10</text><text x="70" y="307" class="m">Если данных нет: «Пока недостаточно проверок»</text><rect class="s" x="425" y="150" width="730" height="400"/><text x="450" y="190" class="h">Навыки</text><rect class="s" x="450" y="210" width="680" height="76"/><text x="470" y="239">Раскрытие скобок · Продолжаем изучение</text><text x="470" y="267">Освоение 64 · подтверждённость 42 · обновлено 26 сентября</text><rect class="s" x="450" y="300" width="680" height="76"/><text x="470" y="329">Линейные уравнения · Нужна практика</text><text x="470" y="357">[Почему предложена практика] [Начать]</text><rect class="s" x="450" y="390" width="680" height="76"/><text x="470" y="419">Правила знаков · Ещё не проверено</text><text x="470" y="447">[Пройти диагностику]</text><rect class="s" x="45" y="580" width="1110" height="90"/><text x="70" y="612">Самооценка помечается отдельно от проверенного результата.</text><text x="70" y="640">[История попыток] → результат, помощь, раскрытие и понятное объяснение</text><text x="50" y="710" class="m">DEV annotation: all values/status are server-provided; client does not calculate them.</text></svg>
